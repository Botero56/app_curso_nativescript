<ActionBar title="Buscar productos">
  <NavigationButton text="Atrás" android.systemIcon="ic_menu_back"></NavigationButton>
</ActionBar>

<GridLayout rows="auto, auto, auto, *" class="p-3">
  <!-- Formulario de búsqueda: caja de texto + botón. [(ngModel)] two-way + validador minLargo -->
  <GridLayout row="0" columns="*, auto">
    <TextField col="0" hint="Nombre o categoría (mín. {{ min }} letras)" returnKeyType="search"
               [(ngModel)]="termino" [minLargo]="min" #ctrl="ngModel" (returnPress)="ctrl.valid && buscar()"
               class="text-lg p-2"></TextField>
    <Button col="1" text="Buscar" [isEnabled]="ctrl.valid" (tap)="buscar()"></Button>
  </GridLayout>

  @if (ctrl.errors?.['minLargo']; as err) {
    <Label row="1" class="text-red-600 text-sm"
           [text]="'Escribe al menos ' + err.requerido + ' caracteres (llevas ' + err.actual + ')'"></Label>
  }

  <Label row="2" class="text-gray-600 my-2" textWrap="true" [text]="estado()"></Label>

  <!-- ListView con plantilla anidada usando FlexboxLayout; ♡/♥ guarda en favoritos -->
  <ListView row="3" [items]="resultados()">
    <ng-template let-item="item">
      <FlexboxLayout flexDirection="row" flexWrap="wrap" alignItems="center" justifyContent="space-between" class="p-3">
        <Label [text]="item.nombre" class="font-bold text-lg" flexGrow="1"></Label>
        <Label [text]="item.categoria" class="chip"></Label>
        <Label [text]="'$' + item.precio" class="ml-2 text-gray-700"></Label>
        <Label [text]="local.esFavorito(item.id) ? '♥' : '♡'" class="text-3xl text-red-500 ml-3"
               (tap)="toggleFavorito(item)"></Label>
      </FlexboxLayout>
    </ng-template>
  </ListView>
</GridLayout>
